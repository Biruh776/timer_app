<html lang="en">
<head>

<title>Timer by Po</title>

<body>

<div id="stage"><canvas id="c"></canvas></div>
<div id="wake" aria-hidden="true"></div>

  <div id="controls">

    <div class="row" id="mins"></div>

      <button id="start">begin</button>
      <button id="reset">reset</button>
      <button id="zen">zen</button>
      <button id="autozen" aria-pressed="true">auto&#8209;zen</button>
    </div>
    <div id="hint">space begin &nbsp;·&nbsp; z zen &nbsp;·&nbsp; esc leave zen &nbsp;·&nbsp; p 30&#8209;second preview</div>
  </div>
</div>


<script src="still.js"></script>
<script src="scenes.js"></script>
<script>start();</script>
